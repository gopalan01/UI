<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" fill="none">
  <defs>
    <!-- 3D Ribbon Gradients -->
    <linearGradient id="aurqo-ribbon-left" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0070F3" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    
    <linearGradient id="aurqo-ribbon-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="aurqo-ribbon-cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Orbital Ring Gradient -->
    <linearGradient id="aurqo-orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="aurqo-sparkle-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- LOGO EMBLEM: 3D Glossy Ribbon 'A' with Orbital Atom Ring -->
  <g transform="translate(4, 3)">
    <!-- Back section of Orbital Ring (Behind 'A') -->
    <ellipse cx="20" cy="21" rx="19" ry="7.5" 
             transform="rotate(-24 20 21)"
             stroke="url(#aurqo-orbit-grad)" 
             stroke-width="2" 
             stroke-dasharray="28 120"
             fill="none" />

    <!-- Left Leg of 3D Ribbon 'A' -->
    <path d="M7 36 C5 36 4 34.5 5.5 32 L17.5 7 C18.8 4.5 21.2 4.5 22.5 7 L34.5 32 C36 34.5 35 36 33 36 C31 36 29.5 35 28.5 33 L20 16 L11.5 33 C10.5 35 9 36 7 36 Z" 
          fill="url(#aurqo-ribbon-left)" />

    <!-- Right Leg & Fold of 'A' -->
    <path d="M20 16 L28.5 33 C29.5 35 31 36 33 36 C35 36 36 34.5 34.5 32 L22.5 7 C21.2 4.5 18.8 4.5 17.5 7 L20 16 Z" 
          fill="url(#aurqo-ribbon-right)" />

    <!-- Crossbar Ribbon Flow -->
    <path d="M12 26 C15 23 25 23 28 26 C29 27 27.5 28.5 25 28.5 C22 28.5 18 28.5 15 28.5 C12.5 28.5 11 27 12 26 Z" 
          fill="url(#aurqo-ribbon-cross)" />

    <!-- Front section of Orbital Ring (In Front of 'A') -->
    <ellipse cx="20" cy="21" rx="19" ry="7.5" 
             transform="rotate(-24 20 21)"
             stroke="url(#aurqo-orbit-grad)" 
             stroke-width="2.2" 
             stroke-dasharray="70 80"
             stroke-dashoffset="-30"
             fill="none" />

    <!-- Orbital Atom Particle Glow -->
    <circle cx="34" cy="12" r="3.2" fill="#00F0FF" filter="url(#aurqo-sparkle-glow)" />
    <circle cx="34" cy="12" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- BRAND NAME 'AURQO' -->
  <g transform="translate(52, 32)">
    <!-- A -->
    <path d="M2 0 L10 -22 L17.5 -22 L25.5 0 L19 0 L17.2 -5.5 L10.3 -5.5 L8.5 0 L2 0 Z M11.8 -10.5 L15.7 -10.5 L13.75 -16.2 L11.8 -10.5 Z" 
          class="aurqo-letter" fill="currentColor" />

    <!-- U -->
    <path d="M29 -22 L35.5 -22 L35.5 -8 C35.5 -3.5 38.5 -1 42.5 -1 C46.5 -1 49.5 -3.5 49.5 -8 L49.5 -22 L56 -22 L56 -7.5 C56 1 49.5 4.5 42.5 4.5 C35.5 4.5 29 1 29 -7.5 L29 -22 Z" 
          class="aurqo-letter" fill="currentColor" />

    <!-- R -->
    <path d="M60 -22 L73.5 -22 C78 -22 81.5 -19 81.5 -14.5 C81.5 -11 79.5 -8.5 76 -7.5 L83 0 L75.5 0 L69.5 -6.8 L66.5 -6.8 L66.5 0 L60 0 L60 -22 Z M66.5 -11.5 L73 -11.5 C74.8 -11.5 75.8 -12.5 75.8 -14.2 C75.8 -16 74.8 -17 73 -17 L66.5 -17 L66.5 -11.5 Z" 
          class="aurqo-letter" fill="currentColor" />

    <!-- Q with Sparkle -->
    <g transform="translate(86, -11)">
      <!-- Outer Q Circle -->
      <circle cx="12" cy="0" r="11" stroke="currentColor" stroke-width="5.5" fill="none" />
      <!-- Q Tail -->
      <path d="M18 6 L25 12" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" />
      <!-- Inner Glowing Sparkle Diamond in Q -->
      <path d="M12 -6 Q12 0 18 0 Q12 0 12 6 Q12 0 6 0 Q12 0 12 -6 Z" 
            fill="url(#aurqo-ribbon-right)" filter="url(#aurqo-sparkle-glow)" />
    </g>

    <!-- O -->
    <g transform="translate(118, -11)">
      <circle cx="11" cy="0" r="11" stroke="currentColor" stroke-width="5.5" fill="none" />
    </g>
  </g>
</svg>
